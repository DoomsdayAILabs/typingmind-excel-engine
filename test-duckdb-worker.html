<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckDB Worker Test</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --panel: #141b34;
      --panel-2: #1c2547;
      --text: #e8ecff;
      --muted: #aeb8e8;
      --ok: #41d392;
      --err: #ff6b81;
      --accent: #7aa2ff;
      --border: #33406f;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #25315c;
    }
    #log {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 320px;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .meta { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Prueba local de duckdb-worker.js</h1>
    <p>Esta página prueba la inicialización del worker y la consulta <code>SELECT 1 AS ok;</code>.</p>

    <div class="actions">
      <button id="btnInit" type="button">Inicializar DuckDB</button>
      <button id="btnQuery" type="button">Ejecutar SELECT 1</button>
    </div>

    <div id="log"></div>
  </main>

  <script>
    const worker = new Worker("./duckdb-worker.js");
    const log = document.getElementById("log");
    const pending = new Map();
    let nextRequestId = 1;

    function writeLine(text, cls = "") {
      const div = document.createElement("div");
      if (cls) div.className = cls;
      div.textContent = text;
      log.appendChild(div);
    }

    function sendRequest(type, payload = {}, timeoutMs = 60000) {
      const requestId = nextRequestId++;
      const startedAt = performance.now();

      writeLine(`Solicitud #${requestId}: ${type}`, "meta");

      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pending.delete(requestId);
          reject(new Error(`Timeout de ${timeoutMs} ms para requestId ${requestId}`));
        }, timeoutMs);

        pending.set(requestId, { resolve, reject, timer, startedAt, type });

        worker.postMessage({
          type,
          requestId,
          ...payload
        });
      });
    }

    worker.onmessage = (event) => {
      const { requestId, success, data, error } = event.data || {};
      const pendingItem = pending.get(requestId);
      if (!pendingItem) return;

      clearTimeout(pendingItem.timer);
      pending.delete(requestId);

      const elapsed = Math.round(performance.now() - pendingItem.startedAt);

      if (success) {
        writeLine(`Respuesta #${requestId} (${elapsed} ms): ${JSON.stringify(data)}`, "ok");
        pendingItem.resolve(data);
      } else {
        writeLine(`Error #${requestId} (${elapsed} ms): ${error}`, "err");
        pendingItem.reject(new Error(error));
      }
    };

    worker.onerror = (event) => {
      writeLine(`Error del worker: ${event.message}`, "err");
      for (const [requestId, item] of pending.entries()) {
        clearTimeout(item.timer);
        item.reject(new Error(`Worker error para requestId ${requestId}`));
      }
      pending.clear();
    };

    document.getElementById("btnInit").addEventListener("click", async () => {
      try {
        const result = await sendRequest("initDuckDB", {}, 120000);
        writeLine(`Init OK: ${JSON.stringify(result)}`, "ok");
      } catch (error) {
        writeLine(`Init FAIL: ${error.message}`, "err");
      }
    });

    document.getElementById("btnQuery").addEventListener("click", async () => {
      try {
        const result = await sendRequest("executeQuery", { sql: "SELECT 1 AS ok;" }, 60000);
        const valid =
          Array.isArray(result) &&
          result.length === 1 &&
          result[0] &&
          result[0].ok === 1;

        if (valid) {
          writeLine('Validación OK: [{"ok":1}]', "ok");
        } else {
          writeLine(`Validación inesperada: ${JSON.stringify(result)}`, "err");
        }
      } catch (error) {
        writeLine(`Query FAIL: ${error.message}`, "err");
      }
    });
  </script>
</body>
</html>
