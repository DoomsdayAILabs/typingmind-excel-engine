<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Verificación visual Fase 3B</title>
  <style>
    body { margin: 0; background: #0f1115; color: #e5e7eb; font-family: -apple-system, sans-serif; }
    .chat { max-width: 780px; margin: 48px auto 0 auto; padding: 24px; background: #1a1c22; border: 1px solid #2d3748; border-radius: 12px; }
    .chat h2 { margin: 0 0 6px 0; font-size: 18px; }
    .chat p { margin: 0 0 16px 0; color: #9ca3af; font-size: 13px; }
    textarea { width: 100%; min-height: 96px; box-sizing: border-box; background: #111318; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="chat">
    <h2>Simulación del chat de TypingMind</h2>
    <p>Verificación visual Fase 5: widget expandido, botón "Enviar a TM", icono flotante minimizado y arrastre (#min, #drag).</p>
    <textarea data-testid="chat-input" placeholder="Type a message"></textarea>
  </div>

  <script>
    // Mocks: worker de DuckDB y fetch (sin red)
    window.fetch = async function () { return { ok: true, text: async () => "// mock" }; };
    window.Worker = class MockWorker {
      postMessage(m) {
        const r = (d) => setTimeout(() => this.onmessage && this.onmessage({ data: { requestId: m.requestId, success: true, data: d } }), 5);
        if (m.type === "initDuckDB") r({ ready: true });
        else if (m.type === "loadCSV") r({ tabla: "excel_data", registros: 12 });
        else if (m.type === "executeQuery") r(window.__rows || []);
      }
    };
    window.__rows = [];
    for (let i = 1; i <= 12; i++) {
      window.__rows.push({ id: i, producto: "Producto " + i, precio: (i * 10.5).toFixed(2), stock: i * 3 });
    }
  </script>

  <!-- Ejecutar: chrome --headless=new --screenshot=shot.png --window-size=1100,780 "file:///<ruta-repo>/tests/fase3b-visual.html" -->
  <script src="../typingmind-excel-engine-v1.0.js"></script>

  <script>
    // Simula la carga real de un CSV mediante el input del widget
    function simularCargaCSV() {
      var csv = "id,producto,precio,stock\n";
      window.__rows = [];
      for (var i = 1; i <= 12; i++) {
        csv += i + ",Producto " + i + "," + (i * 10.5).toFixed(2) + "," + (i * 3) + "\n";
        window.__rows.push({ id: i, producto: "Producto " + i, precio: (i * 10.5).toFixed(2), stock: i * 3 });
      }
      var file = new File([csv], "ventas.csv", { type: "text/csv" });
      var input = document.getElementById("tmee-file-input");
      var dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    // Fase 5: el toggle se hace con un clic (mousedown + mouseup) sobre la cabecera arrastrable
    function simularClicCabecera() {
      var cabecera = document.getElementById("tmee-header");
      var r = cabecera.getBoundingClientRect();
      var x = Math.round(r.left + r.width / 2);
      var y = Math.round(r.top + r.height / 2);
      cabecera.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, clientX: x, clientY: y }));
      cabecera.dispatchEvent(new MouseEvent("mouseup", { bubbles: true, clientX: x, clientY: y }));
    }

    // Fase 5: arrastre simulado con ratón para la captura visual del widget reubicado
    function simularArrastre(dx, dy) {
      var cabecera = document.getElementById("tmee-header");
      var r = cabecera.getBoundingClientRect();
      var x = Math.round(r.left + 40), y = Math.round(r.top + 10);
      cabecera.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, clientX: x, clientY: y }));
      document.dispatchEvent(new MouseEvent("mousemove", { bubbles: true, clientX: x + dx, clientY: y + dy }));
      document.dispatchEvent(new MouseEvent("mouseup", { bubbles: true, clientX: x + dx, clientY: y + dy }));
    }

    setTimeout(function () {
      simularCargaCSV();
      if (location.hash === "#send") setTimeout(function () { document.getElementById("tmee-btn-inject").click(); }, 700);
      if (location.hash === "#min") setTimeout(function () { simularClicCabecera(); }, 700);
      if (location.hash === "#drag") setTimeout(function () { simularArrastre(180, -180); }, 700);
    }, 250);
  </script>
</body>
</html>
