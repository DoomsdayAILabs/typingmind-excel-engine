<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TypingMind Excel Engine - Versiones</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
    h1 { color: #1a252f; }
    p { font-size: 14px; color: #555; }
    ul { list-style: none; padding: 0; max-width: 650px; }
    li { background: #ffffff; margin-bottom: 12px; padding: 14px; border-radius: 8px; border: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
    a { text-decoration: none; color: #0969da; font-weight: bold; }
    a:hover { text-decoration: underline; }
    .btn { background-color: #2ea44f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background-color: #2c974b; }
  </style>
</head>
<body>

  <h1>TypingMind Excel Engine - Historial de Versiones</h1>
  <p>Haz clic en el enlace para abrir el archivo o presiona <b>Copiar Link</b> para usarlo en TypingMind:</p>

  <ul>
    <!-- Versión 0.4.11 -->
    <li>
      <div>
        <strong>v0.4.11-test:</strong><br>
        <a href="typingmind-excel-engine-v0.4.11-test.js" target="_blank">typingmind-excel-engine-v0.4.11-test.js</a>
      </div>
      <button class="btn" onclick="copiarUrl('typingmind-excel-engine-v0.4.11-test.js')">Copiar Link</button>
    </li>

    <!-- Aquí puedes ir agregando más versiones en el futuro -->
  </ul>

  <script>
    function copiarUrl(nombreArchivo) {
      const urlCompleta = window.location.href.split('#')[0].split('?')[0] + nombreArchivo;
      navigator.clipboard.writeText(urlCompleta).then(() => {
        alert('¡Enlace copiado al portapapeles!\n' + urlCompleta);
      });
    }
  </script>

</body>
</html>
